<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123C30">
<title>Registro de tareas · Copropiedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">Registro de tareas</h1>
      <p class="app-header__subtitle">Administración de copropiedades</p>
    </div>
  </header>

  <main class="content">
    <div class="tabs-track" role="tablist" aria-label="Filtrar por estado">
      <button class="tab tab--active" data-tab="pending" type="button" role="tab" aria-selected="true">
        Pendientes <span class="tab__count" id="count-pending">0</span>
      </button>
      <button class="tab" data-tab="completed" type="button" role="tab" aria-selected="false">
        Completadas <span class="tab__count" id="count-completed">0</span>
      </button>
    </div>

    <div id="chip-bar" class="chip-bar" role="group" aria-label="Filtrar por copropiedad"></div>

    <div id="status-banner" class="status-banner" hidden></div>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-state__icon">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <p id="empty-state__text"></p>
    </div>
  </main>

  <button id="fab" class="fab" type="button" aria-haspopup="dialog" aria-label="Agregar tarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 id="modal-title">Nueva tarea</h2>
        <button id="modal-close" class="modal__close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <div class="field">
          <label for="description">¿Qué hay que hacer?</label>
          <textarea id="description" name="description" rows="3" placeholder="Ej: Revisar filtración en el parqueadero" required></textarea>
        </div>
        <div class="field">
          <label for="copropiedad">Copropiedad</label>
          <input id="copropiedad" name="copropiedad" list="copropiedades-list" placeholder="Ej: Torres del Parque" required autocomplete="off">
          <datalist id="copropiedades-list"></datalist>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">Guardar tarea</button>
      </form>
    </div>
  </div>

  <footer class="app-footer">
    <p>Los datos quedan guardados de forma permanente.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
