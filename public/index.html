<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123C30">
<title>Registro de tareas · Copropiedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div>
        <h1 class="app-header__title">Registro de tareas</h1>
        <p class="app-header__subtitle">Administración de copropiedades</p>
      </div>
      <button id="manage-btn" class="header-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"></path></svg>
        Copropiedades
      </button>
    </div>
  </header>

  <main class="content">
    <div class="tabs-track" role="tablist" aria-label="Filtrar por estado">
      <button class="tab tab--active" data-tab="pending" type="button" role="tab" aria-selected="true">
        Pendientes <span class="tab__count" id="count-pending">0</span>
      </button>
      <button class="tab" data-tab="completed" type="button" role="tab" aria-selected="false">
        Completadas <span class="tab__count" id="count-completed">0</span>
      </button>
    </div>

    <div id="chip-bar" class="chip-bar" role="group" aria-label="Filtrar por copropiedad"></div>

    <div id="status-banner" class="status-banner" hidden></div>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-state__icon">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <p id="empty-state__text"></p>
    </div>
  </main>

  <button id="fab" class="fab" type="button" aria-haspopup="dialog" aria-label="Agregar tarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 id="modal-title">Nueva tarea</h2>
        <button id="modal-close" class="modal__close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <div class="field">
          <label for="description">¿Qué hay que hacer?</label>
          <textarea id="description" name="description" rows="3" placeholder="Ej: Revisar filtración en el parqueadero" required></textarea>
        </div>
        <div class="field">
          <label for="copropiedad">Copropiedad</label>
          <select id="copropiedad" name="copropiedad" required>
            <option value="" disabled selected>Selecciona una copropiedad</option>
          </select>
          <button type="button" id="quick-add-toggle" class="link-btn">+ Agregar nueva copropiedad</button>
          <div id="quick-add-row" class="quick-add-row" hidden>
            <input type="text" id="quick-add-input" placeholder="Nombre de la copropiedad">
            <button type="button" id="quick-add-confirm" class="btn btn--small">Agregar</button>
          </div>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">Guardar tarea</button>
      </form>
    </div>
  </div>

  <div id="manage-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manage-title">
      <div class="modal__header">
        <h2 id="manage-title">Copropiedades</h2>
        <button id="manage-close" class="modal__close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <form id="manage-form" class="manage-add-form">
        <input type="text" id="manage-input" placeholder="Nombre de la nueva copropiedad" required>
        <button type="submit" class="btn btn--small">Agregar</button>
      </form>
      <p id="manage-error" class="form-error" hidden></p>

      <ul id="manage-list" class="manage-list"></ul>
      <p id="manage-empty" class="empty-state" hidden>
        <span>Aún no has agregado copropiedades.</span>
      </p>
    </div>
  </div>

  <div id="detail-backdrop" class="modal-backdrop" hidden>
    <div class="modal modal--detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="modal__header">
        <h2 id="detail-title">Detalle de la tarea</h2>
        <button id="detail-close" class="modal__close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <div class="detail-task">
        <span id="detail-tag" class="task-card__tag"></span>
        <p id="detail-description" class="detail-task__description"></p>
        <p id="detail-dates" class="detail-task__dates"></p>
      </div>

      <div class="detail-notes">
        <h3 class="detail-notes__heading">Notas</h3>
        <ul id="notes-list" class="notes-list"></ul>
        <p id="notes-empty" class="notes-empty" hidden>Aún no hay notas. Agrega la primera abajo.</p>
      </div>

      <form id="note-form" class="note-form">
        <textarea id="note-text" rows="2" placeholder="Escribe una nota (ej: se pidió cotización, quedó pendiente el repuesto...)"></textarea>
        <div id="note-photo-preview" class="note-photo-preview" hidden>
          <img id="note-photo-preview-img" alt="Vista previa de la foto">
          <button type="button" id="note-photo-remove" class="note-photo-remove" aria-label="Quitar foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <p id="note-error" class="form-error" hidden></p>
        <div class="note-form__row">
          <label class="note-photo-btn" id="note-photo-label">
            <input type="file" id="note-photo-input" accept="image/*" capture="environment" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v13H4z"></path><circle cx="12" cy="13" r="3.3"></circle></svg>
            Foto
          </label>
          <button type="submit" class="btn btn--primary btn--small" id="note-submit">Agregar nota</button>
        </div>
      </form>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox__close" type="button" aria-label="Cerrar imagen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <img id="lightbox-img" alt="Foto de la nota">
  </div>

  <footer class="app-footer">
    <p>Los datos quedan guardados de forma permanente.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
